<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jahongir Otajonov - Web Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0b0e;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .player-card {
      width: 100%;
      max-width: 440px;
      background: #141418;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 24px 22px 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #8E8E93;
    }

    .online-badge {
      font-size: 11px;
      font-weight: 700;
      color: #1DB954;
      background: rgba(29, 185, 84, 0.12);
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      background: #1DB954;
      border-radius: 50%;
      box-shadow: 0 0 8px #1DB954;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .cover-art-container {
      margin: 22px auto 16px;
      width: 240px;
      height: 240px;
      border-radius: 24px;
      background: linear-gradient(145deg, #1f1f26, #121216);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .cover-icon {
      font-size: 52px;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 12px rgba(29, 185, 84, 0.3));
    }

    .cover-artist {
      font-size: 18px;
      font-weight: 700;
      color: #8E8E93;
      text-align: center;
      line-height: 1.2;
    }

    .track-info {
      text-align: center;
      margin-top: 6px;
    }

    .track-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      font-weight: 600;
      color: #8E8E93;
      margin-top: 4px;
    }

    .progress-section {
      margin-top: 20px;
      padding: 0 6px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: #25252b;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: #1DB954;
      border-radius: 4px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #8E8E93;
      margin-top: 8px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 14px;
    }

    .btn-circle {
      border: none;
      background: #23232a;
      color: #ffffff;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }

    .btn-circle:hover {
      background: #2f2f38;
      transform: scale(1.06);
    }

    .btn-circle:active {
      transform: scale(0.95);
    }

    .btn-nav {
      width: 52px;
      height: 52px;
      font-size: 18px;
    }

    .btn-play {
      width: 68px;
      height: 68px;
      background: #1DB954;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(29, 185, 84, 0.4);
    }

    .btn-play:hover {
      background: #1ed760;
      box-shadow: 0 10px 28px rgba(29, 185, 84, 0.6);
    }

    .playlist-card {
      margin-top: 22px;
      background: #19191f;
      border-radius: 20px;
      padding: 10px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .playlist-card::-webkit-scrollbar {
      width: 6px;
    }

    .playlist-card::-webkit-scrollbar-thumb {
      background: #2c2c36;
      border-radius: 4px;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .song-item:hover {
      background: #22222a;
    }

    .song-item.active {
      background: #262630;
      color: #1DB954;
      font-weight: 700;
    }

    .song-title-text {
      font-size: 14px;
    }

    .hidden-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="header">
      <span class="header-tag">SAMSUNG MUSIC STYLE</span>
      <span class="online-badge">
        <span class="online-dot"></span>
        ONLINE WEB
      </span>
    </div>

    <div class="cover-art-container">
      <div class="cover-icon">🎙️</div>
      <div class="cover-artist">Jahongir<br>Otajonov</div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Qo'shiqni tanlang</div>
      <div class="track-artist" id="trackArtist">Jahongir Otajonov (Jonli ijro)</div>
    </div>

    <div class="progress-section">
      <div class="progress-bar-wrap" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-labels">
        <span id="currentTime">00:00</span>
        <span id="totalTime">00:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-circle btn-nav" id="prevBtn" title="Oldingi">⏮</button>
      <button class="btn-circle btn-play" id="playBtn" title="Ijro / Pauza">▶</button>
      <button class="btn-circle btn-nav" id="nextBtn" title="Keyingi">⏭</button>
    </div>

    <div class="playlist-card" id="playlistContainer"></div>

    <div id="ytPlayerContainer" class="hidden-player"></div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const songs = [
      { title: "Bevafo", videoId: "9c3c-H7P2bY" },
      { title: "Qaddini ursin", videoId: "iY5pU7YI2bE" },
      { title: "Dog'man", videoId: "b8k_h8u9N-A" },
      { title: "Ayrildim", videoId: "o5G7B2C2qGg" },
      { title: "Kechir", videoId: "jLzW4k8Qe9I" },
      { title: "Guldona", videoId: "eY7H7pP0X6E" },
      { title: "Chaqasi bor", videoId: "2M5J6K7N8O9" },
      { title: "Qaddi baland", videoId: "4N5L6K7P8Q0" }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let ytPlayer = null;
    let timerInterval = null;

    const trackTitle = document.getElementById("trackTitle");
    const trackArtist = document.getElementById("trackArtist");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const currentTimeEl = document.getElementById("currentTime");
    const totalTimeEl = document.getElementById("totalTime");
    const playlistContainer = document.getElementById("playlistContainer");

    function renderPlaylist() {
      playlistContainer.innerHTML = "";
      songs.forEach((song, idx) => {
        const item = document.createElement("div");
        item.className = `song-item ${idx === currentIndex ? 'active' : ''}`;
        item.innerHTML = `
          <span class="song-title-text">${idx + 1}. ${song.title}</span>
          <span>${idx === currentIndex ? '🔊' : '▶'}</span>
        `;
        item.addEventListener("click", () => selectSong(idx));
        playlistContainer.appendChild(item);
      });
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayerContainer', {
        height: '10',
        width: '10',
        videoId: songs[0].videoId,
        playerVars: {
          'playsinline': 1,
          'controls': 0
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function selectSong(index) {
      currentIndex = index;
      renderPlaylist();
      trackTitle.textContent = songs[index].title;
      trackArtist.textContent = "Yuklanmoqda...";

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(songs[index].videoId);
        isPlaying = true;
        playBtn.textContent = "⏸";
        trackArtist.textContent = "Jahongir Otajonov (Jonli ijro)";
      }
    }

    function togglePlay() {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
        isPlaying = false;
        playBtn.textContent = "▶";
      } else {
        ytPlayer.playVideo();
        isPlaying = true;
        playBtn.textContent = "⏸";
      }
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      selectSong(currentIndex);
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % songs.length;
      selectSong(currentIndex);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.textContent = "⏸";
        startProgressTracker();
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        playBtn.textContent = "▶";
      } else if (event.data === YT.PlayerState.ENDED) {
        nextSong();
      }
    }

    function formatTime(sec) {
      const mins = Math.floor(sec / 60);
      const secs = Math.floor(sec % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function startProgressTracker() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime && isPlaying) {
          const curr = ytPlayer.getCurrentTime();
          const total = ytPlayer.getDuration();
          if (total > 0) {
            const pct = (curr / total) * 100;
            progressFill.style.width = pct + "%";
            currentTimeEl.textContent = formatTime(curr);
            totalTimeEl.textContent = formatTime(total);
          }
        }
      }, 500);
    }

    progressBar.addEventListener("click", (e) => {
      if (!ytPlayer || !ytPlayer.getDuration) return;
      const rect = progressBar.getBoundingClientRect();
      const clickPos = (e.clientX - rect.left) / rect.width;
      const seekTime = clickPos * ytPlayer.getDuration();
      ytPlayer.seekTo(seekTime, true);
    });

    playBtn.addEventListener("click", togglePlay);
    prevBtn.addEventListener("click", prevSong);
    nextBtn.addEventListener("click", nextSong);

    // Boshlang'ich pleylistni yuklash
    renderPlaylist();
    trackTitle.textContent = songs[0].title;
  </script>
</body>
</html>
